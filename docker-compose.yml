services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paintshop
      POSTGRES_USER: paintshop
      POSTGRES_PASSWORD: paintshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paintshop -d paintshop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
